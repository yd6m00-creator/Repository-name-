<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0e17">
<title>⚽ Match Engine V26.1</title>
<script src="https://js.puter.com/v2/"></script>
<style>
:root{--bg:#0a0e17;--card:#111827;--card2:#1a2332;--border:#1f2937;--text:#f9fafb;--muted:#9ca3af;--green:#10b981;--blue:#3b82f6;--gold:#fbbf24;--red:#dc2626;--ai:#a855f7;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;min-height:100vh;padding-bottom:calc(90px + var(--sb));line-height:1.5;font-size:15px;overflow-x:hidden}
.top-header{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,rgba(10,14,23,.98),rgba(10,14,23,.92));padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;backdrop-filter:blur(12px)}
.top-header h1{font-size:1rem;font-weight:800;background:linear-gradient(135deg,var(--green),var(--blue),var(--ai));-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{display:inline-block;font-size:.62rem;padding:3px 9px;border-radius:20px;background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3);font-weight:700}
.badge.err{background:rgba(239,68,68,.15);color:var(--red);border-color:rgba(239,68,68,.3)}
.badge.load{background:rgba(245,158,11,.15);color:var(--gold);border-color:rgba(245,158,11,.3)}
.badge.ai{background:rgba(168,85,247,.15);color:var(--ai);border-color:rgba(168,85,247,.3);animation:pulse 3s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
.status-bar{background:var(--card2);padding:6px 12px;font-size:.65rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.refresh-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-left:4px;animation:pulse 2s infinite}
.refresh-dot.paused{background:var(--gold);animation:none}
.refresh-dot.error{background:var(--red);animation:none}
.ai-status-bar{background:linear-gradient(90deg,rgba(168,85,247,.15),rgba(59,130,246,.1));padding:5px 12px;font-size:.62rem;color:#d0defc;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(168,85,247,.3)}
.hero-banner{margin:10px;padding:16px;border-radius:16px;background:linear-gradient(135deg,#10b981,#3b82f6,#a855f7);position:relative;overflow:hidden}
.hero-banner::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.25),transparent 50%)}
.hero-banner .hero-title{font-size:1.1rem;font-weight:800;color:#fff;margin-bottom:4px;position:relative;z-index:1}
.hero-banner .hero-sub{font-size:.75rem;color:rgba(255,255,255,.9);position:relative;z-index:1}
.league-scroll{display:flex;gap:10px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;border-bottom:1px solid var(--border)}
.league-scroll::-webkit-scrollbar{display:none}
.league-chip{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;min-width:64px}
.league-chip .league-logo{width:48px;height:48px;border-radius:12px;padding:6px;background:var(--card);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;transition:.2s}
.league-chip .league-logo img{width:100%;height:100%;object-fit:contain}
.league-chip .league-name{font-size:.62rem;color:var(--muted);text-align:center;font-weight:600}
.league-chip.active .league-logo{border-color:var(--green);background:rgba(16,185,129,.1);transform:scale(1.08)}
.league-chip.active .league-name{color:var(--green)}
.date-nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;scrollbar-width:none;background:var(--card);border-bottom:1px solid var(--border)}
.date-nav::-webkit-scrollbar{display:none}
.date-nav-btn{padding:8px 14px;border-radius:12px;font-size:.75rem;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;font-weight:700;min-height:36px;display:flex;align-items:center;gap:4px}
.date-nav-btn.active{background:linear-gradient(135deg,var(--blue),#2563eb);color:#fff;border-color:transparent}
.date-nav-btn.live-tab{background:linear-gradient(135deg,var(--red),#b91c1c);color:#fff;border-color:transparent;animation:pulse 1.5s infinite}
.filter-bar{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.filter-btn{padding:7px 14px;border-radius:16px;font-size:.75rem;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;font-weight:600}
.filter-btn.active{background:linear-gradient(135deg,var(--green),#059669);color:#fff;border-color:transparent}
.section-title{font-size:.9rem;font-weight:800;padding:16px 14px 10px;color:var(--text);display:flex;align-items:center;gap:8px}
.section-title::before{content:"";width:4px;height:18px;background:linear-gradient(180deg,var(--green),var(--blue));border-radius:2px}
.match-card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;margin:0 12px 10px;overflow:hidden;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.match-card.live{border-color:rgba(220,38,38,.6);box-shadow:0 0 20px rgba(220,38,38,.15)}
.match-header-info{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:.65rem;color:var(--muted);border-bottom:1px solid var(--border);background:rgba(255,255,255,.02)}
.match-status-badge{padding:3px 8px;border-radius:8px;font-weight:700;font-size:.62rem}
.match-status-badge.live{background:var(--red);color:#fff;animation:pulse 1.5s infinite}
.match-status-badge.pre{background:rgba(59,130,246,.2);color:var(--blue)}
.match-status-badge.post{background:rgba(107,114,128,.2);color:var(--muted)}
.match-body{padding:14px 12px}
.match-teams-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.team-block{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.team-block.away{flex-direction:row-reverse;text-align:right}
.team-logo{width:38px;height:38px;object-fit:contain;flex-shrink:0}
.team-name{font-size:.85rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-score{font-size:1.4rem;font-weight:800;min-width:70px;text-align:center;letter-spacing:2px;background:linear-gradient(135deg,var(--green),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.match-score.upcoming{color:var(--muted);background:none;-webkit-text-fill-color:var(--muted);font-size:.9rem}
.tab-bar{display:flex;gap:0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;margin:0 12px 12px;overflow-x:auto;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex:1;padding:10px 12px;background:transparent;border:none;color:var(--muted);font-size:.72rem;font-weight:700;cursor:pointer;border-radius:8px;white-space:nowrap;font-family:inherit;min-height:40px}
.tab-btn.active{background:linear-gradient(135deg,var(--green),#059669);color:#fff}
.tab-btn.tab-bet.active{background:linear-gradient(135deg,var(--gold),#f97316);color:#422006}
.tab-btn.tab-ai.active{background:linear-gradient(135deg,var(--ai),var(--blue))}
.tab-content{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin:0 12px 12px}
.tab-content.hidden{display:none}
.detail-header-card{margin:12px;padding:20px 16px;border-radius:16px;background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);text-align:center}
.detail-header-card.live{border-color:rgba(220,38,38,.6)}
.detail-teams{display:flex;justify-content:space-between;align-items:center;gap:10px}
.detail-team{flex:1;text-align:center}
.detail-team img{width:60px;height:60px;object-fit:contain;margin-bottom:8px}
.detail-team-name{font-size:.88rem;font-weight:800}
.detail-score-box{font-size:2rem;font-weight:900;padding:0 10px;letter-spacing:3px}
.detail-meta{font-size:.72rem;color:var(--muted);margin-top:12px}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.82rem;gap:8px;align-items:center}
.stat-row:last-child{border-bottom:none}
.stat-label{color:var(--muted);flex:1}
.stat-value{font-weight:700;text-align:left}
.bar-compare{margin-bottom:14px}
.bar-compare-label{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:5px;font-weight:600}
.bar-bg{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;display:flex}
.bar-home{background:linear-gradient(90deg,var(--green),#059669);height:100%;transition:width .6s}
.bar-away{background:linear-gradient(90deg,var(--blue),#2563eb);height:100%;transition:width .6s}
.ai-panel{background:linear-gradient(135deg,rgba(168,85,247,.1),rgba(59,130,246,.08));border:1px solid var(--ai);border-radius:12px;padding:14px;margin-bottom:12px}
.ai-panel-title{display:flex;align-items:center;gap:6px;color:var(--ai);font-weight:800;font-size:.85rem;margin-bottom:12px}
.ai-panel.live{background:linear-gradient(135deg,rgba(220,38,38,.15),rgba(239,68,68,.08));border-color:var(--red)}
.live-badge{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--red);color:#fff;font-size:.6rem;font-weight:800;animation:pulse 1.5s infinite}
.ai-prediction{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.ai-pred-box{background:var(--card);border-radius:10px;padding:12px 8px;text-align:center}
.ai-pred-box .label{font-size:.62rem;color:var(--muted);margin-bottom:4px;font-weight:600}
.ai-pred-box .value{font-size:1rem;font-weight:800}
.ai-pred-box .value.green{color:var(--green)}
.ai-pred-box .value.blue{color:var(--blue)}
.ai-pred-box .value.gold{color:var(--gold)}
.ai-analysis-text{background:var(--card);border-radius:10px;padding:12px;font-size:.82rem;line-height:1.7;color:#d1d5db}
.bet-item{display:flex;justify-content:space-between;padding:12px;background:var(--card);border-radius:10px;margin-bottom:6px;font-size:.8rem;align-items:center}
.bet-market{color:var(--muted);min-width:80px;font-weight:600}
.bet-selection{flex:1;text-align:center;font-weight:800}
.bet-odds{color:var(--green);font-weight:800;min-width:50px;text-align:left}
.bet-panel{background:linear-gradient(135deg,rgba(251,191,36,.08),rgba(249,115,22,.06));border:1px solid var(--gold);border-radius:12px;padding:14px;margin-bottom:12px}
.bet-panel .bet-title{font-size:.85rem;font-weight:800;color:var(--gold);margin-bottom:10px}
.sim-scoreboard{display:flex;justify-content:space-between;align-items:center;font-size:1.05rem;font-weight:800;margin-bottom:10px;padding:14px;background:var(--card2);border-radius:12px;gap:8px}
.sim-team-label{flex:1;font-size:.85rem;display:flex;align-items:center;gap:6px}
.sim-team-label.home-side{justify-content:flex-start}
.sim-team-label.away-side{justify-content:flex-end;flex-direction:row-reverse}
.sim-team-label img{width:24px;height:24px;object-fit:contain}
.sim-score-val{color:var(--green);font-size:1.6rem;margin:0 8px;font-weight:900;flex-shrink:0}
.sim-progress{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin:10px 0}
.sim-progress-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));width:0%;transition:width .3s}
.sim-controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.sim-ctrl-btn{padding:10px;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;cursor:pointer;font-size:.75rem;font-family:inherit;min-height:42px;font-weight:700}
.sim-ctrl-btn.primary{background:linear-gradient(135deg,var(--green),#059669);color:#fff;border-color:transparent}
.sim-events{max-height:400px;overflow-y:auto;margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
.sim-event{display:flex;gap:8px;padding:10px;margin-bottom:5px;background:var(--card2);border-radius:10px;font-size:.8rem;border-right:3px solid transparent}
.sim-event.goal{border-right-color:var(--green);background:rgba(16,185,129,.15)}
.sim-event.card-y{border-right-color:var(--gold);background:rgba(251,191,36,.1)}
.sim-event.card-r{border-right-color:var(--red);background:rgba(220,38,38,.15)}
.sim-event.corner{border-right-color:var(--gold)}
.sim-event.sub{border-right-color:var(--blue)}
.sim-event.past{opacity:.9}
.sim-event.future{opacity:.65;border-right-style:dashed}
.sim-minute{font-weight:800;color:var(--green);min-width:32px}
.live-marker{text-align:center;padding:8px;margin:8px 0;background:rgba(220,38,38,.2);border-radius:8px;color:#f87171;font-weight:800;font-size:.75rem;border:1px dashed var(--red)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,var(--card),rgba(10,14,23,.98));border-top:1px solid var(--border);display:flex;z-index:1000;padding-bottom:var(--sb);backdrop-filter:blur(20px)}
.nav-item{flex:1;padding:8px 2px;text-align:center;cursor:pointer;color:var(--muted);font-size:.6rem;font-weight:600;position:relative}
.nav-item.active{color:var(--green)}
.nav-item-icon{font-size:1.2rem;display:block;margin-bottom:1px}
.nav-item.badge-red::after{content:attr(data-count);position:absolute;top:2px;right:calc(50% - 18px);background:var(--red);color:#fff;font-size:.55rem;padding:1px 5px;border-radius:8px;font-weight:800;min-width:14px;animation:pulse 1.5s infinite}
.ai-fab{position:fixed;bottom:calc(20px + var(--sb));right:16px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--ai),var(--blue));color:#fff;border:3px solid rgba(255,255,255,.2);font-size:1.5rem;cursor:pointer;z-index:1500;box-shadow:0 6px 24px rgba(168,85,247,.6);display:flex;align-items:center;justify-content:center}
.ai-chat-panel{position:fixed;inset:0;background:var(--card);z-index:2000;display:flex;flex-direction:column}
.chat-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:linear-gradient(135deg,rgba(168,85,247,.25),rgba(59,130,246,.25));border-bottom:1px solid var(--border);font-weight:700;font-size:.95rem}
.chat-close{background:var(--card2);border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.1rem;font-family:inherit}
.chat-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.chat-msg{max-width:88%;padding:12px 14px;border-radius:16px;font-size:.87rem;line-height:1.6;word-wrap:break-word}
.chat-msg.user{align-self:flex-start;background:linear-gradient(135deg,var(--ai),var(--blue));color:#fff}
.chat-msg.ai{align-self:flex-end;background:var(--card2);border:1px solid var(--border)}
.chat-suggestions{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;border-top:1px solid var(--border);background:var(--card);scrollbar-width:none}
.chat-suggestions::-webkit-scrollbar{display:none}
.chat-chip{font-size:.72rem;padding:9px 14px;border-radius:16px;border:1px solid var(--ai);background:rgba(168,85,247,.1);color:#d0defc;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;font-weight:600}
.chat-input-row{display:flex;gap:8px;padding:12px;padding-bottom:calc(12px + var(--sb));background:var(--card2);border-top:1px solid var(--border)}
.chat-input-row input{flex:1;padding:12px 14px;border-radius:22px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.9rem;outline:none;font-family:inherit;min-height:44px}
.chat-input-row button{padding:0;width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--ai),var(--blue));color:#fff;font-size:1.2rem;cursor:pointer;font-family:inherit}
.chat-welcome{text-align:center;color:var(--muted);font-size:.85rem;padding:24px 16px;line-height:1.7}
.empty{text-align:center;color:var(--muted);padding:24px 20px;font-size:.85rem}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.back-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:.85rem;margin:12px;display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-weight:600}
.retry-btn{background:linear-gradient(135deg,var(--gold),#f97316);border:none;color:#422006;padding:10px 20px;border-radius:10px;cursor:pointer;font-weight:800;font-family:inherit;font-size:.85rem;margin-top:10px}
.screen{display:none}
.screen.active{display:block}
.hidden{display:none!important}
.toast{position:fixed;bottom:calc(100px + var(--sb));left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--green);color:var(--text);padding:12px 20px;border-radius:12px;font-size:.85rem;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.error-panel{background:linear-gradient(135deg,rgba(239,68,68,.12),rgba(220,38,38,.06));border:1px solid var(--red);border-radius:12px;padding:14px;margin-bottom:12px;font-size:.78rem;color:#fca5a5}
.warn-panel{background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(249,115,22,.08));border:1px solid var(--gold);border-radius:8px;padding:10px;margin-bottom:12px;font-size:.72rem;color:#fde68a;line-height:1.6}
.metric-box{background:var(--card2);border-radius:10px;padding:10px;text-align:center}
.metric-box .m-label{font-size:.65rem;color:var(--muted);margin-bottom:4px;font-weight:600}
.metric-box .m-value{font-size:.9rem;font-weight:800;color:var(--text)}
.method-tag{display:inline-block;font-size:.62rem;padding:3px 8px;border-radius:10px;background:rgba(168,85,247,.15);color:var(--ai);border:1px solid rgba(168,85,247,.3);margin:2px;font-weight:700}
.accuracy-panel{background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(59,130,246,.08));border:1px solid var(--green);border-radius:12px;padding:12px;margin-bottom:12px}
.accuracy-title{font-size:.78rem;color:var(--green);font-weight:800;margin-bottom:10px}
.accuracy-item{display:flex;justify-content:space-between;padding:6px 0;font-size:.75rem;border-bottom:1px solid var(--border)}
.accuracy-item:last-child{border-bottom:none}
.accuracy-item .acc-label{color:var(--muted)}
.accuracy-item .acc-value{font-weight:700;color:var(--green)}
.orch-panel{background:linear-gradient(135deg,rgba(168,85,247,.15),rgba(59,130,246,.08));border:2px solid var(--ai);border-radius:14px;padding:14px;margin:12px;position:relative;overflow:hidden}
.orch-panel::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--ai),transparent);animation:orchSweep 3s linear infinite}
@keyframes orchSweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.orch-title{font-size:.85rem;font-weight:800;color:var(--ai);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.orch-live-dot{width:8px;height:8px;border-radius:50%;background:var(--ai);animation:pulse 1.5s infinite;box-shadow:0 0 8px var(--ai)}
.orch-log{max-height:180px;overflow-y:auto;font-size:.68rem;color:#d0defc;line-height:1.6;font-family:ui-monospace,monospace}
.orch-log-item{padding:4px 0;border-bottom:1px solid rgba(168,85,247,.15)}
.orch-log-item .time{color:var(--muted);font-size:.6rem}
.player-avatar{width:44px;height:44px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;color:var(--muted);border:2px solid var(--border);flex-shrink:0;overflow:hidden}
.player-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.lineup-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:.82rem}
.lineup-row:last-child{border-bottom:none}
.lineup-row .jersey{width:24px;text-align:center;font-weight:800;color:var(--green);font-size:.72rem}
.lineup-row .name{flex:1;font-weight:700}
.lineup-row .pos{font-size:.62rem;color:var(--muted);padding:2px 6px;border-radius:4px;background:var(--card2);font-weight:700}
.current-score-badge{display:inline-block;padding:4px 12px;background:rgba(16,185,129,.15);border:1px solid var(--green);border-radius:20px;font-weight:800;font-size:.85rem;color:var(--green);margin-top:8px}
.issue-card{background:var(--card);border:1px solid var(--border);border-right:4px solid var(--gold);border-radius:12px;padding:14px;margin-bottom:10px;position:relative}

function computeForm(matches,teamId){
  try{if(!matches||!matches.length)return{form:0.5,results:[],gpg:1.2,cpg:1.2};

      const st=(c.status?.type?.state)||"pre";if(st!=="post")continue;
      const tS=safeNum(t.score,0),oS=safeNum(o.score,0);
      gf+=tS;ga+=oS;count++;
      if(tS>oS)results.push('W');else if(tS===oS)results.push('D');else results.push('L');
      if(results.length>=10)break;
    }
    if(count===0)return{form:0.5,results:[],gpg:1.2,cpg:1.2};

      if(our>their)hW++;else if(our<their)aW++;else d++;
      tg+=hS+aS;if(hS>0&&aS>0)b++;c++;
    }
    return{homeWins:hW,awayWins:aW,draws:d,total:c,avgGoals:c>0?tg/c:2.5,btts:c>0?b/c:0.5};
  }catch(e){return{homeWins:0,awayWins:0,draws:0,total:0,avgGoals:2.5,btts:0.5};}
}

function extractRealEvents(summary,cs){
  try{
    const arr=summary.keyEvents||[];
    const out=[];
    arr.forEach(e=>{
      const clock=(e.clock&&(e.clock.displayValue||e.clock.value))||"";
      const min=parseInt(String(clock).replace(/[^\d]/g,""))||0;
      if(!min)return;
      const typeText=(e.type?.text||e.type?.id)||"";
      const text=e.text||"";
      const comb=(typeText+" "+text).toLowerCase();
      let type=null,icon="",label="";
      if(/goal|scoring/i.test(comb)){type="goal";icon="⚽";label="هدف";}
      else if(/yellow/i.test(comb)){type="card-y";icon="🟨";label="صفراء";}
      else if(/red/i.test(comb)){type="card-r";icon="🟥";label="طرد";}
      else if(/substitution/i.test(comb)){type="sub";icon="🔄";label="تبديل";}
      else if(/corner/i.test(comb)){type="corner";icon="🚩";label="ركنية";}
      else return;
      let player="";
      const parts=e.participants||e.athletesInvolved||[];
      if(parts.length)player=parts.map(p=>p.athlete?.displayName||p.athlete?.shortName||"").filter(Boolean).join(" / ");
      let side="home";
      if(e.team&&e.team.id){const idx=cs.findIndex(c=>String(c.team?.id)===String(e.team.id));if(idx===1)side="away";}
      out.push({min,type,icon,label,player,side});
    });
    return out.sort((a,b)=>a.min-b.min);
  }catch(e){return[];}
}

function predictMatch(summary,standings,historyMatches){
  try{
    const header=summary.header||{};
    const comp=header.competitions[0]||{};
    const cs=comp.competitors||[];
    const home=cs.find(x=>x.homeAway==="home")||{};
    const away=cs.find(x=>x.homeAway==="away")||{};
    const hT=home.team||{},aT=away.team||{};
    const hN=hT.shortDisplayName||hT.displayName||"Home";
    const aN=aT.shortDisplayName||aT.displayName||"Away";
    const stateType=(comp.status?.type?.state)||"pre";
    const isLive=stateType==="in",isPost=stateType==="post";
    const curH=safeNum(home.score,0),curA=safeNum(away.score,0);
    let currentMinute=isLive?getCurrentMinute(summary):(isPost?90:0);
    const espnClock=comp.status?.displayClock||"";
    const espnPeriod=comp.status?.period||1;
    const espnClockSec=safeNum(comp.status?.clock,0);
    let isDataSane=true,sanityNote="";
    if(isLive&&currentMinute===0){isDataSane=false;sanityNote="minute=0 لمباراة مباشرة";}
    if(currentMinute>95){currentMinute=90;isDataSane=false;sanityNote="الدقيقة > 95";}
    const remainingMinutes=Math.max(0,95-currentMinute);
    const hStats=fromStandings(findStanding(standings,hT.id));
    const aStats=fromStandings(findStanding(standings,aT.id));
    const matches=historyMatches||state.matches||[];
    const hForm=computeForm(matches,hT.id);
    const aForm=computeForm(matches,aT.id);
    hStats.form=hForm.form;aStats.form=aForm.form;
    if(hForm.gpg>0){hStats.gpg=hForm.gpg*0.6+hStats.gpg*0.4;hStats.cpg=hForm.cpg*0.6+hStats.cpg*0.4;}
    if(aForm.gpg>0){aStats.gpg=aForm.gpg*0.6+aStats.gpg*0.4;aStats.cpg=aForm.cpg*0.6+aStats.cpg*0.4;}
    const h2h=computeH2H(summary.headToHeadGames||summary.seasonseries||[],hT.id);
    const base=Accuracy.computeXG(hStats,aStats,state.league);
    const xgH_full=base.xgH,xgA_full=base.xgA;
    let liveStats=null,xgH_accum=0,xgA_accum=0;
    if(isLive){const ls=extractLiveStats(summary);liveStats=ls;xgH_accum=computeLiveXG(ls.h);xgA_accum=computeLiveXG(ls.a);}
    let expectedHome,expectedAway,xgH_remaining,xgA_remaining;
    if(isLive&&currentMinute>0){
      const rateH=Math.max(0.008,xgH_accum/currentMinute);
      const rateA=Math.max(0.008,xgA_accum/currentMinute);
      xgH_remaining=Math.min(2.5,rateH*remainingMinutes);
      xgA_remaining=Math.min(2.5,rateA*remainingMinutes);
      expectedHome=curH+xgH_remaining;
      expectedAway=curA+xgA_remaining;
    }else if(isPost){expectedHome=curH;expectedAway=curA;xgH_remaining=0;xgA_remaining=0;}
    else{expectedHome=xgH_full;expectedAway=xgA_full;xgH_remaining=xgH_full;xgA_remaining=xgA_full;}
    if(state.aiCommands&&state.aiCommands.overrideXg&&isDataSane){
      const ov=state.aiCommands.overrideXg;
      if(ov.home!=null&&ov.home>0)expectedHome=curH+Math.min(2.5,safeNum(ov.home,xgH_remaining));
      if(ov.away!=null&&ov.away>0)expectedAway=curA+Math.min(2.5,safeNum(ov.away,xgA_remaining));
    }
    const finalH=Math.max(0,Math.min(9,Math.round(expectedHome)));
    const finalA=Math.max(0,Math.min(9,Math.round(expectedAway)));
    const pmH=isLive?(xgH_remaining+0.3):xgH_full;
    const pmA=isLive?(xgA_remaining+0.3):xgA_full;
    const matrix=Accuracy.matrix(pmH,pmA);
    const probs=Accuracy.oneXTwo(matrix);
    const mc=Accuracy.mc(pmH,pmA,2000);
    const ensemble=Accuracy.ensemble(matrix,mc);
    const bttsProb=Accuracy.btts(matrix);
    const over25=Accuracy.over(matrix,2.5);
    const over15=Accuracy.over(matrix,1.5);
    const over35=Accuracy.over(matrix,3.5);
    const topScores=Accuracy.topScores(matrix,6);
    let winnerSide=finalH>finalA?"home":finalA>finalH?"away":"draw";
    const winner=winnerSide==="home"?hN:winnerSide==="away"?aN:"تعادل";
    const totalGoals=finalH+finalA;
    const confidence=Math.min(92,Math.round(Math.max(ensemble.home,ensemble.draw,ensemble.away)*(isLive?1.3:1)));
    const bestBets=[];
    bestBets.push({market:"النتيجة النهائية",selection:finalH+"-"+finalA,odds:"1.80",prob:60});
    bestBets.push({market:"الفائز",selection:winner,odds:winnerSide==="draw"?"3.20":"1.65",prob:winnerSide==="draw"?25:70});
    bestBets.push({market:totalGoals>2.5?"Over 2.5":"Under 2.5",selection:totalGoals>2.5?"Over":"Under",odds:"1.85",prob:62});
    bestBets.push({market:"BTTS",selection:(finalH>0&&finalA>0)?"نعم":"لا",odds:"1.70",prob:70});
    const realEvents=extractRealEvents(summary,cs);
    return{
      home:{id:hT.id,name:hN,logo:hT.logo,stats:hStats,form:hForm,rank:hStats.rank},
      away:{id:aT.id,name:aN,logo:aT.logo,stats:aStats,form:aForm,rank:aStats.rank},
      h2h,xgH:xgH_full,xgA:xgA_full,
      xgHRemaining:xgH_remaining,xgARemaining:xgA_remaining,
      liveXgH:xgH_accum,liveXgA:xgA_accum,
      matrix,probs,mc,ensemble,
      bttsProb,over15,over25,over35,topScores,
      bestScore:{score:finalH+"-"+finalA,prob:0},
      winner,winnerSide,confidence,bestBets,
      currentScore:{home:curH,away:curA},
      currentMinute,remainingMinutes,
      finalScore:{home:finalH,away:finalA},
      isLive,isPre:stateType==="pre",isPost,
      liveStats,
      dataQuality:isLive?100:Math.min(100,(hStats.gp||0)*5+(aStats.gp||0)*5),
      realEvents,
      _espnClock:espnClock,_espnPeriod:espnPeriod,_espnClockSec:espnClockSec,
      _isDataSane:isDataSane,_sanityNote:sanityNote
    };
  }catch(e){
    console.error("predictMatch error:",e);
    return{home:{name:"Home",stats:fromStandings(null),form:{form:0.5},rank:10},away:{name:"Away",stats:fromStandings(null),form:{form:0.5},rank:10},
      h2h:{homeWins:0,awayWins:0,draws:0,total:0,avgGoals:2.5,btts:0.5},
      xgH:1.3,xgA:1.1,xgHRemaining:1.3,xgARemaining:1.1,liveXgH:0,liveXgA:0,
      matrix:[[1]],probs:{home:33,draw:33,away:34},mc:{home:33,draw:33,away:34,avgGoals:2.5,btts:50},
      ensemble:{home:33,draw:33,away:34},bttsProb:50,over15:60,over25:45,over35:25,
      topScores:[{score:"1-1",prob:10}],bestScore:{score:"1-1",prob:10},
      winner:"تعادل",winnerSide:"draw",confidence:33,bestBets:[],
      currentScore:{home:0,away:0},currentMinute:0,remainingMinutes:95,
      finalScore:{home:1,away:1},isLive:false,isPre:true,isPost:false,
      liveStats:null,dataQuality:0,realEvents:[],
      _isDataSane:false,_sanityNote:e.message};
  }
}

function distributeGoalsBalanced(hCount,aCount,minMinute,maxMinute,rng){
  const total=hCount+aCount;
  if(total===0)return{home:[],away:[]};
  const range=Math.max(1,maxMinute-minMinute);
  const minGap=Math.max(3,Math.floor(range/(total+1))-1);
  const used=[];
  for(let i=0;i<total;i++){
    let slot=null;let attempts=0;
    while(attempts<100){
      const c=minMinute+Math.floor(rng()*range);
      if(!used.some(u=>Math.abs(u-c)<minGap)){slot=c;break;}
      attempts++;
    }
    if(slot===null){
      slot=Math.round(minMinute+(range/(total+1))*(i+1));
      while(used.some(u=>Math.abs(u-slot)<minGap)&&slot<maxMinute)slot++;
      if(slot>maxMinute)slot=maxMinute;
    }
    used.push(slot);
  }
  used.sort((a,b)=>a-b);
  const indices=Array.from({length:used.length},(_,i)=>i);
  for(let i=indices.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[indices[i],indices[j]]=[indices[j],indices[i]];}
  const homeMinutes=[],awayMinutes=[];
  indices.forEach((idx,i)=>{if(i<hCount)homeMinutes.push(used[idx]);else awayMinutes.push(used[idx]);});
  return{home:homeMinutes.sort((a,b)=>a-b),away:awayMinutes.sort((a,b)=>a-b)};
}
function distributeEventsWithGap(count,minMinute,maxMinute,minGap,rng){
  if(count<=0)return[];
  const range=Math.max(1,maxMinute-minMinute);
  const used=[];
  for(let i=0;i<count;i++){
    let slot=null;let attempts=0;
    while(attempts<50){
      const c=minMinute+Math.floor(rng()*range);
      if(!used.some(u=>Math.abs(u-c)<minGap)){slot=c;break;}
      attempts++;
    }
    if(slot===null){
      slot=Math.round(minMinute+(range/(count+1))*(i+1));
      while(used.some(u=>Math.abs(u-slot)<minGap)&&slot<maxMinute)slot++;
      if(slot>maxMinute)slot=maxMinute;
    }
    used.push(slot);
  }
  return used.sort((a,b)=>a-b);
}

function addIssue(severity,title,msg,context){
  // ★ فلتر نهائي: استبعاد أي false positive
  if(BANNED_PATTERN.test(String(title||""))||BANNED_PATTERN.test(String(msg||""))){
    console.log("🚫 Issue blocked by filter:",title);
    return null;
  }
  const sig=(severity||"info")+"|"+(title||"مشكلة");
  const recent=state.issues.find(i=>i._sig===sig&&Date.now()-i.ts<300000);
  if(recent){
    recent.occurrences=(recent.occurrences||1)+1;
    recent.ts=Date.now();
    recent.msg=msg;
    localStorage.setItem('issues',JSON.stringify(state.issues));
    updateIssuesBadge();
    return recent;
  }
  const issue={
    id:"i"+Date.now()+"-"+Math.random().toString(36).slice(2,6),
    severity:severity||"info",
    title:title||"مشكلة",
    msg:msg||"",
    context:context||"",
    _sig:sig,
    occurrences:1,
    ts:Date.now(),
    read:false
  };
  state.issues.unshift(issue);
  state.issues=state.issues.slice(0,100);
  localStorage.setItem('issues',JSON.stringify(state.issues));
  updateIssuesBadge();
  if(severity==="high"||severity==="medium")showToast("🚨 "+(title||"مشكلة"),severity==="high"?"error":"warn");
  return issue;
}

async function loadMatches(){
  const list=$("matches-list");
  list.innerHTML='<div class="empty"><div class="spinner"></div><p style="margin-top:10px">جاري التحميل...</p></div>';
  setStatus("⏳","load");
  const dates=[-1,0,1,2,3,4].map(d=>getDateString(d));
  const results=await Promise.all(dates.map(d=>fetchData(`${ESPN}/${state.league}/scoreboard?dates=${d}`,8000)));
  let all=[],ok=false;
  results.forEach(r=>{if(r.ok&&r.data.events){ok=true;r.data.events.forEach(e=>{if(!all.find(x=>x.id===e.id))all.push(e);});}});
  if(!ok){setStatus("❌","err");list.innerHTML=`<div class="empty"><p style="font-size:2rem">📡</p><button class="retry-btn" onclick="loadMatches()">🔄</button></div>`;return;}
  all.sort((a,b)=>{const o={in:0,pre:1,post:2};const sa=o[getMatchState(a)]??3,sb=o[getMatchState(b)]??3;if(sa!==sb)return sa-sb;return new Date(a.date)-new Date(b.date);});
  state.matches=all;
  const lc=all.filter(m=>getMatchState(m)==="in").length;
  setStatus(`✅ ${all.length}${lc>0?' · '+lc+' مباشر':''}`,"");
  renderDateNav();renderLivePanel();renderFeatured();renderMatches();
  $("last-update-time").textContent=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
}

    html+=arr.map(m=>renderMatchCard(m,league)).join("");

  list.innerHTML=html;

  if(!sumRes.ok){cont.innerHTML=`<div class="error-panel">⚠️<br><button class="retry-btn" onclick="openMatch('${matchId}')">🔄</button></div>`;return;}

function renderH2H(h2h,hT,aT){
  if(!h2h||!h2h.length)return'<div class="empty">لا مواجهات</div>';
  try{
    const games=h2h.slice(0,10);
    let hw=0,aw=0,dr=0,html="";
    games.forEach(g=>{
      const cs=(g.competitions?.[0]?.competitors)||[];
      const h=cs.find(x=>x.homeAway==="home")||{},a=cs.find(x=>x.homeAway==="away")||{};
      const hs=safeNum(h.score,0),as=safeNum(a.score,0);
      if(hs>as)hw++;else if(hs<as)aw++;else dr++;
      html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:.78rem;gap:6px">
        <div style="font-size:.68rem;color:var(--muted);min-width:65px">${formatDate(g.date)}</div>
        <div style="flex:1;text-align:center;font-weight:700">${esc(h.team?.shortDisplayName||"?")}</div>
        <div style="background:var(--card2);padding:3px 10px;border-radius:6px;font-weight:800">${hs} - ${as}</div>
        <div style="flex:1;text-align:center;font-weight:700">${esc(a.team?.shortDisplayName||"?")}</div>
      </div>`;
    });
    const hN=hT.shortDisplayName||"?",aN=aT.shortDisplayName||"?";
    return`<div style="margin-bottom:14px;display:flex;justify-content:space-around;text-align:center">
      <div><div style="color:var(--green);font-size:1.5rem;font-weight:800">${hw}</div><div style="font-size:.68rem;color:var(--muted)">${esc(hN)}</div></div>
      <div><div style="color:var(--gold);font-size:1.5rem;font-weight:800">${dr}</div><div style="font-size:.68rem;color:var(--muted)">تعادل</div></div>
      <div><div style="color:var(--blue);font-size:1.5rem;font-weight:800">${aw}</div><div style="font-size:.68rem;color:var(--muted)">${esc(aN)}</div></div>
    </div>${html}`;
  }catch(e){return'<div class="empty">خطأ</div>';}

function renderEvents(summary){
  try{
    const arr=summary.keyEvents||[];
    if(!arr.length)return'<div class="empty">لا أحداث</div>';
    const cs=(summary.header?.competitions?.[0]?.competitors)||[];
    const out=[];
    arr.forEach(e=>{
      const clock=(e.clock&&(e.clock.displayValue||e.clock.value))||"";
      const min=parseInt(String(clock).replace(/[^\d]/g,""))||0;
      if(!min)return;
      const typeText=(e.type?.text||e.type?.id)||"";
      const text=e.text||"";
      const comb=(typeText+" "+text).toLowerCase();
      let type=null,icon="";
      if(/goal|scoring/i.test(comb)){type="goal";icon="⚽";}
      else if(/yellow/i.test(comb)){type="yellow";icon="🟨";}
      else if(/red/i.test(comb)){type="red";icon="🟥";}
      else if(/substitution/i.test(comb)){type="sub";icon="🔄";}
      else if(/corner/i.test(comb)){type="corner";icon="🚩";}
      else return;
      let player="";
      const parts=e.participants||e.athletesInvolved||[];
      if(parts.length)player=parts.map(p=>p.athlete?.displayName||p.athlete?.shortName||"").filter(Boolean).join(" / ");
      let side="home";
      if(e.team&&e.team.id){const idx=cs.findIndex(c=>String(c.team?.id)===String(e.team.id));if(idx===1)side="away";}
      out.push({min,type,icon,player,side});
    });
    out.sort((a,b)=>a.min-b.min);
    return out.map(e=>`<div class="sim-event ${e.type==='goal'?'goal':e.type==='yellow'?'card-y':e.type==='red'?'card-r':e.type==='corner'?'corner':'sub'}">
      <span class="sim-minute">${e.min}'</span><span>${e.icon}</span><span>${e.type==='goal'?'هدف':e.type==='yellow'?'صفراء':e.type==='red'?'طرد':e.type==='corner'?'ركنية':'تبديل'}${e.player?' — '+esc(e.player):''}</span>
    </div>`).join("");
  }catch(e){return'<div class="empty">خطأ</div>';}
}
function switchTab(tab,btn){
  document.querySelectorAll('.tab-bar .tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.add('hidden'));
  const el=$("tab-"+tab);if(el)el.classList.remove('hidden');
  if(tab==='sim')renderSimulator();
  if(tab==='betting')renderBettingTab();
  if(tab==='metrics')renderMetricsTab();
  if(tab==='accuracy')renderAccuracyTab();
}

function runAnalysis(){
  try{
    if(!state.currentSummary){$("analysis-content").innerHTML='<div class="error-panel">⚠️</div>';return;}
    setStatus("🧠","load");
    const prediction=predictMatch(state.currentSummary,state.currentDetail.standings,state.matches);
    state.currentAnalysis=prediction;
    updateMatchKnowledge(prediction);
    setStatus("🎯","");
    renderAnalysis(prediction);
    renderMetricsTab();
    renderAccuracyTab();
    if(!$("tab-betting").classList.contains("hidden"))renderBettingTab();
    if(!$("tab-sim").classList.contains("hidden"))renderSimulator();
    const log=state.predictionLog;
    log.unshift({matchId:state.currentSummary.header?.id,prediction:prediction.winner+" "+prediction.bestScore.score,ts:Date.now()});
    state.predictionLog=log.slice(0,30);

    console.error(e);

function buildLocalText(r){
  const parts=[];
  if(r.isLive){
    parts.push(`جارية في الدقيقة ${r.currentMinute} — ${r.home.name} ${r.currentScore.home} - ${r.currentScore.away} ${r.away.name}.`);
    parts.push(`xG تراكمي: ${r.home.name} ${r.liveXgH.toFixed(2)} — ${r.away.name} ${r.liveXgA.toFixed(2)}.`);
    parts.push(`متبقٍ ${r.remainingMinutes} دقيقة (xG: ${r.xgHRemaining.toFixed(2)} / ${r.xgARemaining.toFixed(2)}).`);
    parts.push(`النهائية المتوقعة: ${r.finalScore.home}-${r.finalScore.away}. الفائز: ${r.winner}.`);
  }else if(r.isPost){
    parts.push(`المباراة انتهت ${r.currentScore.home}-${r.currentScore.away}.`);
  }else{
    parts.push(`${r.home.name} (م ${r.home.rank}) ضد ${r.away.name} (م ${r.away.rank}).`);
    parts.push(`xG: ${r.xgH.toFixed(2)} - ${r.xgA.toFixed(2)}. المتوقعة: ${r.finalScore.home}-${r.finalScore.away}.`);
  }
  parts.push(`BTTS: ${Math.round(r.bttsProb)}%. Over 2.5: ${Math.round(r.over25)}%.`);
  if(r.h2h.total>0)parts.push(`H2H: ${r.h2h.homeWins}-${r.h2h.draws}-${r.h2h.awayWins}.`);
  return parts.join(" ");
}

function buildSimQueueForLive(){
  try{
    const r=state.currentAnalysis;
    const summary=state.currentSummary;
    const cs=summary.header.competitions[0].competitors||[];
    const hTeam=cs.find(c=>c.homeAway==="home")||{};
    const aTeam=cs.find(c=>c.homeAway==="away")||{};
    const hN=hTeam.team?.shortDisplayName||"المستضيف";
    const aN=aTeam.team?.shortDisplayName||"الضيف";
    const currentMinute=r.currentMinute;
    const remaining=Math.max(2,95-currentMinute);
    const neededH=Math.max(0,r.finalScore.home-r.currentScore.home);
    const neededA=Math.max(0,r.finalScore.away-r.currentScore.away);
    const seed=hashString(String(r.home.id||hN)+String(r.away.id||aN)+"v261");
    const rng=mulberry32(seed);
    const past=(r.realEvents||[]).filter(e=>e.min<=currentMinute).map(e=>({
      minute:e.min,type:e.type,cls:e.type,
      text:`${e.icon} ${e.label} — ${e.side==="home"?hN:aN}${e.player?" ("+e.player+")":""}`,
      side:e.side,isPast:true
    }));
    const future=[];
    const goals=distributeGoalsBalanced(neededH,neededA,currentMinute+2,94,rng);
    goals.home.forEach(m=>future.push({minute:m,type:"goal",cls:"goal",text:"⚽ هدف — "+hN,side:"home",isPast:false}));
    goals.away.forEach(m=>future.push({minute:m,type:"goal",cls:"goal",text:"⚽ هدف — "+aN,side:"away",isPast:false}));
    const addC=Math.min(4,Math.max(1,Math.round(remaining/25)));
    const cSlots=distributeEventsWithGap(addC,currentMinute+2,94,8,rng);
    cSlots.forEach(m=>{const s=rng()<0.5?"home":"away";future.push({minute:m,type:"corner",cls:"corner",text:"🚩 ركنية — "+(s==="home"?hN:aN),side:s,isPast:false});});
    const addCards=Math.min(2,Math.max(0,Math.round(remaining/40)));
    const cardSlots=distributeEventsWithGap(addCards,currentMinute+10,94,15,rng);
    cardSlots.forEach(m=>{const s=rng()<0.5?"home":"away";future.push({minute:m,type:"card-y",cls:"card-y",text:"🟨 صفراء — "+(s==="home"?hN:aN),side:s,isPast:false});});
    if(remaining>20){
      const addSubs=Math.min(2,Math.round(remaining/30));
      const subSlots=distributeEventsWithGap(addSubs,currentMinute+15,94,15,rng);
      subSlots.forEach(m=>{const s=rng()<0.5?"home":"away";future.push({minute:m,type:"sub",cls:"sub",text:"🔄 تبديل — "+(s==="home"?hN:aN),side:s,isPast:false});});
    }
    future.forEach(ev=>{if(ev.minute>94)ev.minute=94;if(ev.minute<=currentMinute)ev.minute=currentMinute+1;});
    future.sort((a,b)=>a.minute-b.minute);
    return{past:past.sort((a,b)=>a.minute-b.minute),future,currentMinute};
  }catch(e){console.error(e);return{past:[],future:[],currentMinute:0};}
}
function buildSimQueueForPre(){
  try{
    const r=state.currentAnalysis;
    const cs=state.currentSummary.header.competitions[0].competitors||[];
    const hTeam=cs.find(c=>c.homeAway==="home")||{};
    const aTeam=cs.find(c=>c.homeAway==="away")||{};
    const hN=hTeam.team?.shortDisplayName||"المستضيف";
    const aN=aTeam.team?.shortDisplayName||"الضيف";
    const seed=hashString(String(r.home.id||hN)+String(r.away.id||aN)+"v261");
    const rng=mulberry32(seed);
    const events=[];
    const hG=r.finalScore.home;
    const aG=r.finalScore.away;
    const goals=distributeGoalsBalanced(hG,aG,5,90,rng);
    goals.home.forEach(m=>events.push({minute:m,type:"goal",cls:"goal",text:"⚽ هدف — "+hN,side:"home",isPast:false}));
    goals.away.forEach(m=>events.push({minute:m,type:"goal",cls:"goal",text:"⚽ هدف — "+aN,side:"away",isPast:false}));
    const cSlots=distributeEventsWithGap(10,3,92,7,rng);
    cSlots.forEach(m=>{const s=rng()<0.5?"home":"away";events.push({minute:m,type:"corner",cls:"corner",text:"🚩 ركنية — "+(s==="home"?hN:aN),side:s,isPast:false});});
    const cardSlots=distributeEventsWithGap(4,10,88,12,rng);
    cardSlots.forEach(m=>{const s=rng()<0.5?"home":"away";events.push({minute:m,type:"card-y",cls:"card-y",text:"🟨 صفراء — "+(s==="home"?hN:aN),side:s,isPast:false});});
    const subSlots=distributeEventsWithGap(3,55,88,10,rng);
    subSlots.forEach(m=>{const s=rng()<0.5?"home":"away";events.push({minute:m,type:"sub",cls:"sub",text:"🔄 تبديل — "+(s==="home"?hN:aN),side:s,isPast:false});});
    events.sort((a,b)=>a.minute-b.minute);
    return{past:[],future:events,currentMinute:0};
  }catch(e){return{past:[],future:[],currentMinute:0};}
}

function startSim(){
  try{
    if(state.sim){clearInterval(state.sim);state.sim=null;}
    const isLive=state.currentAnalysis?.isLive;
    if(!state.simEvents)state.simEvents=isLive?buildSimQueueForLive():buildSimQueueForPre();
    const {past,future}=state.simEvents;
    const evt=$("sim-events");if(evt)evt.innerHTML="";
    if(isLive&&past.length){
      past.forEach(ev=>addSimEvent(ev.minute,ev.cls,ev.text,true));
      const marker=document.createElement("div");
      marker.className="live-marker";
      marker.textContent=`⬇️ اللحظة الحالية (د ${state.currentAnalysis.currentMinute}) ⬇️`;
      evt.prepend(marker);
    }
    let minute=state.simClock||(isLive?state.currentAnalysis.currentMinute:0);
    let hS=parseInt($("sim-hs").textContent)||0;
    let aS=parseInt($("sim-as").textContent)||0;
    let idx=0;
    const speed=state.aiCommands?.adjustSimulator?.speed||250;
    state.sim=setInterval(()=>{
      minute++;
      state.simClock=minute;
      const mEl=$("sim-minute");if(mEl)mEl.textContent=`⏱️ ${minute}'`;
      const pr=$("sim-progress");if(pr)pr.style.width=Math.min(100,(minute/95)*100)+"%";
      while(idx<future.length&&future[idx].minute<=minute){
        const ev=future[idx];
        if(ev.type==="goal"){
          if(ev.side==="home"){hS++;$("sim-hs").textContent=hS;}
          else{aS++;$("sim-as").textContent=aS;}
        }
        addSimEvent(ev.minute,ev.cls,ev.text,false);
        idx++;
      }
      if(minute>=95){
        clearInterval(state.sim);state.sim=null;
        addSimEvent(95,"info",`🏁 نهاية — ${hS} - ${aS}`,false);
      }
    },speed);
  }catch(e){showToast("خطأ: "+e.message,"error");}
}
function pauseSim(){if(state.sim){clearInterval(state.sim);state.sim=null;}}
function resetSim(){
  pauseSim();state.simClock=0;state.simEvents=null;
  const r=state.currentAnalysis;
  const isLive=r&&r.isLive;
  const hS=isLive?r.currentScore.home:0;
  const aS=isLive?r.currentScore.away:0;
  $("sim-hs").textContent=hS;$("sim-as").textContent=aS;
  $("sim-progress").style.width="0%";
  $("sim-minute").textContent=isLive?`⏱️ الدقيقة ${r.currentMinute}`:"⏱️ 0'";
  $("sim-events").innerHTML="";
}
function fastSim(){
  try{
    pauseSim();
    const isLive=state.currentAnalysis?.isLive;
    const q=isLive?buildSimQueueForLive():buildSimQueueForPre();
    const r=state.currentAnalysis;
    const curH=isLive?r.currentScore.home:0;
    const curA=isLive?r.currentScore.away:0;
    $("sim-events").innerHTML="";
    if(isLive&&q.past.length){
      q.past.forEach(ev=>addSimEvent(ev.minute,ev.cls,ev.text,true));
      const marker=document.createElement("div");
      marker.className="live-marker";
      marker.textContent=`⬇️ اللحظة الحالية (د ${r.currentMinute}) ⬇️`;
      $("sim-events").prepend(marker);
    }
    let hS=curH,aS=curA;
    q.future.forEach(ev=>{
      if(ev.type==="goal"){if(ev.side==="home")hS++;else aS++;}
      addSimEvent(ev.minute,ev.cls,ev.text,false);
    });
    $("sim-hs").textContent=hS;$("sim-as").textContent=aS;
    $("sim-progress").style.width="100%";
    $("sim-minute").textContent="⏱️ 95'";
    const tH=r?r.finalScore.home:hS;
    const tA=r?r.finalScore.away:aS;
    addSimEvent(95,"info",`🏁 نهاية — ${hS} - ${aS} (المتوقعة: ${tH}-${tA})`,false);
  }catch(e){showToast("خطأ: "+e.message,"error");}
}
function addSimEvent(minute,cls,text,isPast){
  const evt=$("sim-events");if(!evt)return;
  const div=document.createElement("div");
  div.className="sim-event "+cls+(isPast?" past":" future");
  div.innerHTML=`<span class="sim-minute">${minute}'</span><span>${text}</span>`;
  evt.prepend(div);
}

let loopTimer=null,lastMatchesUpdate=0,lastLiveUpdate=0,lastCurrentUpdate=0,failCount=0;
function startLoop(){
  if(loopTimer)clearInterval(loopTimer);
  loopTimer=setInterval(async()=>{
    if(document.hidden)return;
    const now=Date.now();
    const onHome=$("home-screen").classList.contains("active");
    const onMatch=$("match-screen").classList.contains("active");
    const hasLive=state.matches.some(m=>getMatchState(m)==="in");
    const currentIsLive=state.currentSummary&&getMatchStateFromSummary(state.currentSummary)==="in";
    if(failCount>=5){
      $("refresh-dot").classList.add("error");
      setTimeout(()=>{failCount=0;$("refresh-dot").classList.remove("error");},60000);
      return;
    }
    if(currentIsLive&&onMatch&&now-lastCurrentUpdate>20000){lastCurrentUpdate=now;await refreshCurrentMatch();}
    else if(onHome&&hasLive&&now-lastLiveUpdate>25000){lastLiveUpdate=now;await refreshLive();}
    else if(onHome&&now-lastMatchesUpdate>120000){lastMatchesUpdate=now;await refreshAll();}
  },5000);
}
async function refreshCurrentMatch(){
  try{
    const matchId=state.currentSummary.header?.id;
    if(!matchId)return;
    const r=await fetchData(`${ESPN}/${state.league}/summary?event=${matchId}`,7000);
    if(!r.ok){failCount++;return;}
    failCount=0;
    const oldH=state.currentSummary.header.competitions[0].competitors.find(c=>c.homeAway==='home')?.score;
    const oldA=state.currentSummary.header.competitions[0].competitors.find(c=>c.homeAway==='away')?.score;
    state.currentSummary=r.data;
    const newH=r.data.header?.competitions?.[0]?.competitors?.find(c=>c.homeAway==='home')?.score;
    const newA=r.data.header?.competitions?.[0]?.competitors?.find(c=>c.homeAway==='away')?.score;
    const sb=$("live-score-box");if(sb)sb.textContent=`${newH} - ${newA}`;
    const clock=$("live-clock");if(clock&&r.data.header?.competitions?.[0]?.status)clock.textContent=r.data.header.competitions[0].status.displayClock||"";
    const evC=$("events-content");if(evC)evC.innerHTML=renderEvents(r.data);
    if(oldH!==newH||oldA!==newA){showToast(`⚽ هدف! ${newH} - ${newA}`);if(navigator.vibrate)navigator.vibrate(200);}
    runAnalysis();
    if(!$("tab-sim").classList.contains("hidden"))renderSimulator();
    $("last-update-time").textContent=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
  }catch(e){failCount++;}
}
async function refreshLive(){
  try{
    const r=await fetchData(`${ESPN}/${state.league}/scoreboard`,7000);
    if(!r.ok){failCount++;return;}
    failCount=0;
    const evs=r.data.events||[];
    evs.forEach(ev=>{const ex=state.matches.find(m=>m.id===ev.id);if(ex)Object.assign(ex,ev);});
    renderMatches();
    $("last-update-time").textContent=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
  }catch(e){failCount++;}
}
async function refreshAll(){
  try{
    const dates=[0,1].map(d=>getDateString(d));
    const results=await Promise.all(dates.map(d=>fetchData(`${ESPN}/${state.league}/scoreboard?dates=${d}`,7000)));
    let ok=false;
    results.forEach(r=>{if(r.ok&&r.data.events){ok=true;r.data.events.forEach(e=>{const ex=state.matches.find(m=>m.id===e.id);if(ex)Object.assign(ex,e);else state.matches.push(e);});}});
    if(!ok){failCount++;return;}
    failCount=0;
    renderMatches();renderDateNav();
    $("last-update-time").textContent=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
  }catch(e){failCount++;}
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){$("refresh-dot").classList.add("paused");}
  else{$("refresh-dot").classList.remove("paused");lastMatchesUpdate=0;}
});

function init(){
  // ★ حذف كل المشاكل القديمة (false positives من V26)
  const before=state.issues.length;
  state.issues=state.issues.filter(i=>!BANNED_PATTERN.test(String(i.title||""))&&!BANNED_PATTERN.test(String(i.msg||"")));
  const after=state.issues.length;
  if(before!==after)console.log(`🚫 Removed ${before-after} false positives from storage`);
  localStorage.setItem('issues',JSON.stringify(state.issues));
  
  renderLeagues();
  loadMatches();
  loadScorers(state.league);
  startLoop();
  updateIssuesBadge();
  setTimeout(()=>{Orchestrator.start();Orchestrator.log("V26.1 نشط — zero false positives");},5000);
}
init();
</script>
